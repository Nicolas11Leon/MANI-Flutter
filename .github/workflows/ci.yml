name: CI - Flutter (lint, pruebas, SonarQube Cloud y build)

# Lint, pruebas con cobertura, análisis de SonarQube Cloud con espera del Quality
# Gate (ADR-0005) y build web. SonarQube Community de la VM de Calidad no analiza
# Dart; por eso Flutter usa SonarQube Cloud (organización trama-as, proyecto
# Trama-AS_MANI-Flutter), que sí analiza ramas y pull requests.
#
# El plan gratuito de SonarQube Cloud solo analiza la rama principal del proyecto,
# configurada como develop; por eso el push solo dispara en develop. release y
# main quedan cubiertas por el análisis de los PRs que llegan a ellas.
#
# Requisito: secreto SONAR_TOKEN del repositorio con un token de SonarQube Cloud.
# Tiene prioridad sobre el SONAR_TOKEN de la organización, que es del servidor
# self-hosted y no sirve aquí.

on:
  pull_request:
    branches: [ develop, release, main ]
  push:
    branches: [ develop ]
  workflow_dispatch:

# En PR se cancela la corrida anterior; en push cada commit conserva su análisis.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Flutter Lint, Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deshabilita shallow clone para análisis preciso de SonarQube

      - name: Ensure environment file exists
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=show --set-exit-if-changed .

      - name: Analyze code (Linter)
        run: flutter analyze

      - name: Run widget & unit tests with coverage
        run: flutter test --coverage

      # Los PRs desde forks no reciben secretos: el job falla aquí en vez de
      # pasar sin análisis.
      - name: Verificar token de SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN no está disponible (secreto faltante o PR desde un fork)."
            exit 1
          fi

      # v8.2.2 fijada por SHA del tag (ba9859e). Espera el Quality Gate: si falla,
      # falla el job y el check requerido del ruleset.
      - name: Análisis de SonarQube Cloud y espera del Quality Gate
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # QAS-45 (SCRUM-1681): el gate "Sonar way" solo mide el rating de
      # mantenibilidad, y un issue Critical nuevo no lo baja de A. La organización
      # no permite gates propios, así que este paso falla el job si el PR trae
      # issues Blocker o Critical abiertos. Corre después de la espera del gate,
      # cuando el análisis ya está procesado. Si la API no responde o la respuesta
      # no trae el total, el paso también falla.
      - name: Sin issues Blocker o Critical nuevos (QAS-45)
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          numero_pr: ${{ github.event.pull_request.number }}
        run: |
          respuesta=$(curl -sfS -u "${SONAR_TOKEN}:" --get "https://sonarcloud.io/api/issues/search" \
            --data-urlencode "componentKeys=Trama-AS_MANI-Flutter" \
            --data-urlencode "pullRequest=${numero_pr}" \
            --data-urlencode "severities=BLOCKER,CRITICAL" \
            --data-urlencode "issueStatuses=OPEN,CONFIRMED" \
            --data-urlencode "ps=100")
          total=$(echo "$respuesta" | jq -r '.total')
          echo "Issues Blocker o Critical nuevos en el PR #${numero_pr}: ${total}"
          echo "$respuesta" | jq -r '.issues[] | "::error file=\(.component | sub("^[^:]*:"; "")),line=\(.line // 1)::\(.severity) \(.rule): \(.message)"'
          test "$total" = "0"

      - name: Verify Web Build
        run: flutter build web --release
